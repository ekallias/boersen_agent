# Copy to config.toml (git-ignored) and adjust. Secrets come from environment variables only.

[paths]
data_dir = "data"         # SQLite state, downloaded newsletters, price cache
reports_dir = "reports"   # PDF reports (+ Markdown copies)
keep_markdown = true

[report]
language = "en"                 # en | de - reports, charts and the AI's text (codes stay English)

[brief]
# The market strip at the top of the daily brief. kind: index | usd (price in USD) | fx (rate) | yield (percent).
# The symbols are Yahoo symbols; leave this out to use the six defaults (S&P 500, DAX, Nasdaq, Brent, EUR/USD, US 10J).
[[brief.market_items]]
label = "S&P 500"
symbol = "^GSPC"
kind = "index"

[[brief.market_items]]
label = "DAX"
symbol = "^GDAXI"
kind = "index"

[[brief.market_items]]
label = "Nasdaq"
symbol = "^IXIC"
kind = "index"

[[brief.market_items]]
label = "Brent"
symbol = "BZ=F"
kind = "usd"

[[brief.market_items]]
label = "EUR/USD"
symbol = "EURUSD=X"
kind = "fx"

[[brief.market_items]]
label = "US 10J"
symbol = "^TNX"
kind = "yield"

[strategy]
# Editable personal targets. The example is illustrative, not investment advice.
targets = { high_risk = 10, stocks = 40, safe = 50 }
# ISINs in this list count as high-risk instead of ordinary stocks.
high_risk_isins = []

[paperless]
url_env = "PAPERLESS_URL"       # e.g. http://192.168.1.32:8000 on the home server
token_env = "PAPERLESS_TOKEN"
correspondent = "Börsen Signale"
upload_reports = false          # true: also store each PDF report in Paperless
report_tags = []                # Paperless tag ids for uploaded reports, e.g. [12]

[market]
provider = "yahoo"              # yahoo (free, unofficial) | eodhd (paid) | csv (offline)
token_env = "EODHD_API_TOKEN"   # only for eodhd
auto_lookup = true              # map ISINs/names to symbols via the provider's search (marked unverified)
history_years = 3

# Override provider symbols if needed (defaults in boersen_agent/config.py), e.g. for EODHD:
# [market.symbols]
# dow_utility = "DJU.INDX"
# brent = "BZ.COMM"

[rules]
# Parameters marked [U] in docs/METHODS.md are best guesses. Override here, e.g.:
# nasdaq_buy_weeks = 26
# near_stop_pct = 3.0

[ai]
# The AI analyst (Claude). Credentials: ANTHROPIC_API_KEY (or a LiteLLM virtual key, see docs/HOMESERVER.md).
enabled = true
mode = "api"                    # api: call the Claude API | handoff: `prepare` + `finish` around a Claude Code
                                # session that writes the analysis itself (docs/CLAUDE_CLOUD.md)
model = "claude-opus-5-5"          # fallback model
model_daily = "claude-sonnet-5-5"  # daily brief (optional; defaults to model)
model_issue = "claude-opus-5-5"    # issue report (optional; defaults to model)
effort_daily = "medium"         # low | medium | high | xhigh | max
effort_issue = "high"
max_tokens = 32000
# base_url = "http://litellm:4000/anthropic"   # route through a LiteLLM gateway (or set ANTHROPIC_BASE_URL)
server_fallbacks = true         # Anthropic re-runs a declined request on another model; set false if your gateway rejects it

[email]
# Every generated PDF report is e-mailed to these addresses (boersen_agent/mailer.py).
# The password is read from the environment variable named in password_env.
enabled = false
smtp_host = "smtp.example.com"
smtp_port = 587                       # 587: STARTTLS; 465: implicit TLS
user = "you@example.com"
from = "you@example.com"
to = ["you@example.com"]
password_env = "SMTP_PASSWORD"
